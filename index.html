<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12-Digit Generator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #172b4d;
    }
    .result-box {
      background: #f4f5f7;
      border: 2px solid #dfe1e6;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #091e42;
      user-select: all;
      cursor: pointer;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-gen {
      background: #0052cc;
      color: #ffffff;
    }
    .btn-gen:hover {
      background: #0065ff;
    }
    .btn-copy {
      background: #ebecf0;
      color: #172b4d;
    }
    .btn-copy:hover {
      background: #dfe1e6;
    }
    .btn-copy.copied {
      background: #36b37e;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>12-Digit Randomizer</h2>

  <div class="result-box" id="resultDisplay" onclick="copyNumber()" title="Click to copy">
    000000000000
  </div>

  <div class="actions">
    <button class="btn-gen" onclick="generateNumber()">Generate</button>
    <button class="btn-copy" id="copyBtn" onclick="copyNumber()">Copy</button>
  </div>
</div>

<script>
  let currentNumber = '';

  function generateNumber() {
    let result = '';
    for (let i = 0; i < 12; i++) {
      result += Math.floor(Math.random() * 10);
    }
    currentNumber = result;
    document.getElementById('resultDisplay').textContent = currentNumber;
    resetCopyButton();
  }

  function copyNumber() {
    if (!currentNumber) return;

    navigator.clipboard.writeText(currentNumber).then(() => {
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(resetCopyButton, 1200);
    });
  }

  function resetCopyButton() {
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.textContent = 'Copy';
    copyBtn.classList.remove('copied');
  }

  // Generate immediately on load
  generateNumber();
</script>

</body>
</html>
